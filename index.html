 svg.addEventListener('pointerup',e=>{if(!drag)return;let cell=point(e),d=drag;drag=null;if(d.moved&&ghost){ghost.x=cell.x-d.offset.x;ghost.y=cell.y-d.offset.y;place();return;}if(ghost){ghost.x=cell.x;ghost.y=cell.y;place();}else if(d.id){selected=d.id;render();}else if(selected){let p=state.items.find(q=>q.id===selected);ghost={...p,x:cell.x,y:cell.y};place();}else render();});svg.addEventListener('pointercancel',()=>{drag=null;if(ghost&&state.items.some(p=>p.id===ghost.id))ghost=null;render();});}
async function exportImage(){toast('결과 이미지를 만들고 있어요…');let svg=$('#room-result'),xml=new XMLSerializer().serializeToString(svg),img=new Image(),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));img.onload=()=>{let c=document.createElement('canvas');c.width=1080;c.height=1150;let ctx=c.getContext('2d');ctx.fillStyle='#f8f6ef';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#486953';ctx.font='bold 54px sans-serif';ctx.fillText('나의 6평 원룸',75,100);ctx.fillStyle='#8a947e';ctx.font='26px sans-serif';ctx.fillText('좁은 집, 무한한 가능성',75,150);ctx.drawImage(img,140,170,800,850);let a=E.analyze(state.items);ctx.font='bold 34px sans-serif';ctx.fillStyle='#486953';ctx.fillText(`생활 4/4   ·   수납 ${a.capacity}칸   ·   바닥 ${a.free.toFixed(1)}㎡`,75,1065);let data=c.toDataURL('image/png');dialog('나의 원룸 이미지',`<p>아래 버튼으로 PNG를 저장하세요. 모바일에서는 이미지를 길게 눌러 저장할 수도 있어요.</p><img alt="나의 원룸 결과 이미지" src="${data}" style="width:100%;border-radius:12px"><a class="primary save-image" href="${data}" download="나의_6평_원룸.png">PNG 파일 저장 ↓</a>`,'<button class="secondary" data-act="close">결과로 돌아가기</button>');URL.revokeObjectURL(url);};img.onerror=()=>{toast('이미지 저장이 어려워요. 인쇄 / PDF를 이용해 주세요.');URL.revokeObjectURL(url)};img.src=url;}

 case'hint':{let list=state.stage===1?['가구 사이로 사람이 움직일 자리도 필요해요.','크기와 사용 공간을 함께 살펴보세요.','잘 들어가지 않는다면 배치 점검을 눌러 생각을 이어 가요.']:['한 가구가 여러 역할을 할 수 있을까요?','하루 중 언제 사용하는지도 생각해 보세요.','바닥 말고 비어 있는 높이나 자투리 공간은 없나요?','가구 앞 빈칸을 현관과 연결해 보세요.'];dialog('작은 생각의 실마리',`<p>${list[hints++%list.length]}</p>`,'<button class="primary" data-act="close">다시 생각해 볼게요</button>',icon('hint',26));break}
