function renderResult(){let a=E.analyze(state.items),f=E.analyze(state.first),answer=state.answers||{},escape=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let multi=[...new Set(state.items.filter(p=>D[p.type].multi).map(p=>D[p.type].name))],vert=[...new Set(state.items.filter(p=>D[p.type].vertical).map(p=>D[p.type].name))];$('#app').innerHTML=`${header()}<div class="result"><div class="title"><small>MISSION COMPLETE</small><h1>나의 6평, 가능성은 무한대!</h1><p style="font-size:12px;color:#89947e;margin-top:7px">집의 크기는 그대로. 생활은 더 넓게.</p></div>${room(state.items,'result')}<div class="result-stats"><div><b>4 / 4</b>생활 기능</div><div><b>${a.capacity}칸</b>확보한 수납</div><div><b>${a.free.toFixed(1)}㎡</b>남은 바닥</div></div><section class="panel"><h3>이렇게 달라졌어요</h3><div class="compare"><div>${room(state.first,'before')}처음 시도<br>${f.features.length}/4 기능 · ${f.capacity}칸</div><div>${room(state.items,'after')}완성한 집<br>4/4 기능 · ${a.capacity}칸</div></div><p>남은 바닥 ${f.free.toFixed(1)} → ${a.free.toFixed(1)}㎡<br>남은 면적이 작아져도 더 많은 기능을 담고 통로를 확보했다면 효율적인 설계예요.</p></section><section class="panel"><h3>내가 발견한 방법</h3><label for="q1">① 나는 공간을 어떻게 더 효율적으로 활용했을까?</label><textarea id="q1" data-answer="q1" placeholder="내가 고른 가구와 달라진 점을 적어 보세요.">${escape(answer.q1)}</textarea><label for="q2">② 책상 겸 식탁과 침대 아래 수납은 어떤 차이가 있을까?</label><textarea id="q2" data-answer="q2" placeholder="사용하는 목적과 위치를 비교해 보세요.">${escape(answer.q2)}</textarea>${state.revealed?`<div class="concept"><strong>공간의 다목적 활용</strong>하나의 공간을 여러 가지 목적으로 사용하는 방법.<br>내 설계: ${multi.join(', ')||'사용한 가구 없음. 하나의 공간을 시간에 따라 바꾸어 쓰는 방법도 생각해 보세요.'}</div><div class="concept"><strong>공간의 입체적 활용</strong>평소 사용하지 않는 자투리 공간이나 높이를 활용하는 방법.<br>내 설계: ${vert.join(', ')||'사용한 가구 없음. 벽과 침대 아래도 살펴보세요.'}</div><p><b>집의 크기를 넓히지 않고도 생활 공간을 더 효율적으로 활용할 수 있었던 이유는 무엇일까?</b></p><textarea data-answer="inquiry" placeholder="나의 말로 원리를 정리해 보세요.">${escape(answer.inquiry)}</textarea>`:'<button class="primary" data-act="reveal">내 생각과 function bindRoom(){let svg=$('#room');if(!svg)return;const point=e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:Math.floor((q.x-44)/32),y:Math.floor((q.y-40)/32)}};
 svg.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;let cell=point(e),piece=e.target.closest('[data-piece]'),id=piece?.dataset.piece,p=state.items.find(q=>q.id===id);drag={clientX:e.clientX,clientY:e.clientY,id:ghost?null:id,moved:false,offset:!ghost&&p?{x:cell.x-p.x,y:cell.y-p.y}:{x:0,y:0}};svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.clientX,e.clientY-drag.clientY)<10&&!drag.moved)return;drag.moved=true;let cell=point(e);if(drag.id&&!ghost){let p=state.items.find(q=>q.id===drag.id);selected=p.id;ghost={...p};}if(ghost){ghost.x=cell.x-drag.offset.x;ghost.y=cell.y-drag.offset.y;let old=svg.querySelector('[data-ghost]');if(old)old.remove();if(drag.id){let original=svg.querySelector('[data-piece="'+drag.id+'"]');if(original)original.style.opacity='.2';}let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('data-ghost','1');g.style.pointerEvents='none';g.innerHTML=furniture(ghost,true);svg.append(g)}});
 svg.addEventListener('pointerup',e=>{if(!drag)return;let cell=point(e),d=drag;drag=null;if(d.moved&&ghost){ghost.x=cell.x-d.offset.x;ghost.y=cell.y-d.offset.y;place();return;}if(ghost){ghost.x=cell.x;ghost.y=cell.y;place();}else if(d.id){selected=d.id;render();}else if(selected){let p=state.items.find(q=>q.id===selected);ghost={...p,x:cell.x,y:cell.y};place();}else render();});svg.addEventListener('pointercancel',()=>{drag=null;if(ghost&&state.items.some(p=>p.id===ghost.id))ghost=null;render();});}
async function exportImage(){toast('결과 이미지를 만들고 있어요…');let svg=$('#room-result'),xml=new XMLSerializer().serializeToString(svg),img=new Image(),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));img.onload=()=>{let c=document.createElement('canvas');c.width=1080;c.height=1500+Object.values(state.answers).reduce((n,t)=>n+Math.ceil(String(t).length/33)*40+60,0);let ctx=c.getContext('2d');ctx.fillStyle='#f8f6ef';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#486953';ctx.font='bold 54px sans-serif';ctx.fillText('나의 6평 원룸',75,100);ctx.fillStyle='#8a947e';ctx.font='26px sans-serif';ctx.fillText('좁은 집, 무한한 가능성',75,150);ctx.drawImage(img,140,170,800,850);let a=E.analyze(state.items);ctx.font='bold 34px sans-serif';ctx.fillStyle='#486953';ctx.fillText(`생활 4/4   ·   수납 ${a.capacity}칸   ·   바닥 ${a.free.toFixed(1)}㎡`,75,1065);let y=1130;function wrap(t){ctx.font='25px sans-serif';let line='';for(let ch of t){if(ctx.measureText(line+ch).width>920){ctx.fillText(line,75,y);line='';y+=37;}line+=ch;}ctx.fillText(line,75,y);y+=42;}ctx.fillStyle='#53624b';for(let [k,t]of [['q1','내가 발견한 방법'],['q2','두 방법의 차이'],['inquiry','나의 정리'],['where','우리 집의 불편한 곳'],['how','적용할 방법'],['effect','기대되는 변화']]){if(state.answers[k]){wrap(t+' : '+state.answers[k]);y+=9;}}if(y>1740){let larger=document.createElement('canvas');larger.width=1080;larger.height=y+60;let lx=larger.getContext('2d');lx.fillStyle='#f8f6ef';lx.fillRect(0,0,1080,larger.height);lx.drawImage(c,0,0);c=larger;}let data=c.toDataURL('image/png');dialog('나의 원룸 이미지',`<p>아래 버튼으로 PNG를 저장하세요. 모바일에서는 이미지를 길게 눌러 저장할 수도 있어요.</p><img alt="나의 원룸 결과 이미지" src="${data}" style="width:100%;border-radius:12px"><a class="primary save-image" href="${data}" download="나의_6평_원룸.png">PNG 파일 저장 ↓</a>`,'<button class="secondary" data-act="close">결과로 돌아가기</button>');URL.revokeObjectURL(url);};img.onerror=()=>{toast('이미지 저장이 어려워요. 인쇄 / PDF를 이용해 주세요.');URL.revokeObjectURL(url)};img.src=url;}

document.addEventListener('change',e=>{if(e.target.id==='speed'){state.speed=e.target.value;save();document.body.className=state.speed}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.type){let type=b.dataset.type;if(type==='under')lowView=true;ghost={id:'p'+Date.now(),type,x:2,y:5,r:0,open:false};selected=null;render();return}if(b.dataset.cat){cat=+b.dataset.cat;render();return}let act=b.dataset.act;
 switch(act){case'start':state.stage=1;save();render();break;case'resume':render();break;case'close':closeModal();break;case'sound':state.sound=!state.sound;save();sound();render();break;case'level':lowView=!lowView;render();toast(lowView?'아래쪽 가구를 선택할 수 있어요.':'위쪽 가구까지 모두 보여요.');break;case'grid':grid=!grid;render();break;case'zoom':zoom=!zoom;render();break;case'route':route=!route;render();if(route)toast('초록 칸: 현관에서 이동할 수 있는 공간');break;case'place':place();break;case'cancel':ghost=null;selected=null;render();break;case'move':ghost={...state.items.find(p=>p.id===selected)};render();break;case'rotate':{let p=ghost||state.items.find(p=>p.id===selected);if(!p)break;let next={...p,r:(p.r+1)%4};if(ghost){ghost=next;render()}else{let err=E.error(next,state.items.filter(q=>q.id!==p.id));if(err)toast(err);else change(state.items.map(q=>q.id===p.id?next:q));}break}case'delete':{let p=state.items.find(q=>q.id===selected);change(state.items.filter(q=>q.id!==selected&&!(D[q.type].under&&['bed','loft'].includes(p.type)&&q.x===p.x&&q.y===p.y)));selected=null;render();break}case'undo':if(undo.length){state.items=JSON.parse(undo.pop());selected=null;ghost=null;save();render()}break;case'clear':dialog('가구를 모두 비울까요?','<p>현재 미션은 그대로 유지돼요. 실행 취소로 되돌릴 수도 있어요.</p>','<button class="primary" data-act="clear-confirm">가구 비우기</button><button class="secondary" data-act="close">계속 꾸미기</button>');break;case'clear-confirm':closeModal();selected=null;ghost=null;change([]);break;case'transform':transform();break;case'inspect':inspect();break;case'complete':complete();break;case'mission2':closeModal();state.stage=2;cat=1;ghost=null;selected=null;save();render();break;case'mission3':closeModal();state.stage=3;cat=2;ghost=null;selected=null;save();render();break;
 case'hint':{let list=state.stage===1?['가구 사이로 사람이 움직일 자리도 필요해요.','크기와 사용 공간을 함께 살펴보세요.','잘 들어가지 않는다면 배치 점검을 눌러 생각을 이어 가요.']:['한 가구가 여러 역할을 할 수 있을까요?','하루 중 언제 사용하는지도 생각해 보세요.','바닥 말고 비어 있는 높이나 자투리 공간은 없나요?','가구 앞 빈칸을 현관과 연결해 보세요.'];dialog('작은 생각의 실마리',`<p>${list[hints++%list.length]}</p>`,'<button class="primary" data-act="close">다시 생각해 볼게요</button>',icon('hint',26));break}
 case'settings':dialog('내 원룸 설정',`<label>애니메이션<select id="speed"><option value="normal" ${state.speed==='normal'?'selected':''}>기본</option><option value="slow" ${state.speed==='slow'?'selected':''}>느리게</option><option value="instant" ${state.speed==='instant'?'selected':''}>건너뛰기</option></select></label><p>가구 선택 → 방을 터치하면 바로 배치<br>놓인 가구를 바로 드래그하거나, 선택 후 빈 곳을 터치해 옮기세요.<br>삭제와 되돌리기로 자유롭게 수정할 수 있어요.<br><br>0.5m 단위 교육용 모형입니다. 주방·욕실 8㎡ + 생활 영역 12㎡, 총 20㎡(약 6평). 접근 공간은 격자 단위로 단순화했어요.</p>`,'<button class="primary" data-act="close">계속 꾸미기</button><button class="secondary" data-act="restart">처음부터 다시</button>',icon('settings',26));break;
 case'restart':dialog('새로운 원룸을 시작할까요?','<p>현재 설계와 작성한 답변이 지워져요. 필요하다면 결과를 먼저 저장해 주세요.</p>','<button class="primary" data-act="restart-confirm">처음부터 시작</button><button class="secondary" data-act="close">돌아가기</button>');break;case'restart-confirm':closeModal();state={version:1,stage:1,items:[],first:[],mid:[],answers:{},sound:state.sound,speed:state.speed,attempts:0};ghost=null;selected=null;undo=[];cat=0;save();render();break;
 case'reveal':if(!state.answers.q1?.trim()||!state.answers.q2?.trim()){toast('두 질문에 내 생각을 먼저 적어 주세요.');break}state.revealed=true;save();render();break;case'export':exportImage();break;case'print':window.print();break;case'edit':state.stage=3;cat=2;save();render();break;
 }});
if(state.stage)showHome();else render();
</script></body></html>
